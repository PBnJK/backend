<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="/static/css/editor.css" rel="stylesheet" />
  </head>
  <body>
    <div id="wrapper">
      <h1>Writing new article</h1>
      <form method="POST">
        <div>
          <label for="title">Title</label>
          <input type="text" name="title" placeholder="My Cool Title" />
        </div>
        <div>
          <label for="content">Body</label>
          <textarea
            name="content"
            rows="40"
            cols="80"
            placeholder="Lorem ipsum dolor sit amet..."
          ></textarea>
        </div>
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
